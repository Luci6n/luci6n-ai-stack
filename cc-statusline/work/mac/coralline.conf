# coralline config — WORK profile (pay-as-you-go API, billed per token)
# Same 4-theme rotation as personal; limit gauges + burn swapped for `cost`.

# Cycle theme per launch: nord -> morning-haze -> gruvbox-dark -> claude-coral -> nord -> ...
# A small append-only log ("session_id|idx" per line) remembers which index
# every session already landed on, so concurrent sessions (multiple terminal
# tabs) can't desync each other by racing on a single shared "last session"
# value. A session already in the log always reuses its own idx; a genuinely
# new session_id advances one step past whatever the log's last line used.
_cor_themes=(nord morning-haze gruvbox-dark claude-coral)
_cor_n=${#_cor_themes[@]}
_cor_state="$CORALLINE_DIR/theme-rotation.state"
_cor_session_id=$(printf '%s' "$input" | jq -r '.session_id // empty' 2>/dev/null)
_cor_idx=""
if [ -f "$_cor_state" ]; then
  _cor_idx=$(awk -F'|' -v sid="$_cor_session_id" '$1==sid{print $2; f=1} END{exit !f}' "$_cor_state" 2>/dev/null)
fi
if [ -z "$_cor_idx" ]; then
  _cor_last_idx=$(tail -n 1 "$_cor_state" 2>/dev/null | awk -F'|' '{print $2}')
  _cor_idx=$(( (${_cor_last_idx:-$((_cor_n - 1))} + 1) % _cor_n ))
  mkdir -p "$CORALLINE_DIR"
  printf '%s|%s\n' "$_cor_session_id" "$_cor_idx" >> "$_cor_state"
  tail -n 50 "$_cor_state" > "$_cor_state.tmp" 2>/dev/null && mv "$_cor_state.tmp" "$_cor_state"
fi
_cor_pick="${_cor_themes[$_cor_idx]}"
. "$HOME/.claude/coralline/themes/${_cor_pick}.conf"

# Brighten each theme's gauge segments (ctx/5h/7d) above its stock near-black
# so they stay visible as distinct pills against a pure-black terminal
# background instead of blending into it. Same idea per theme, own hue family.
case "$_cor_pick" in
  nord)
    VL_BG_CTX="80,86,98"; VL_BG_5H="100,106,118"; VL_BG_7D="120,126,138" ;;
  morning-haze)
    VL_BG_CTX="72,77,87"; VL_BG_5H="92,97,107"; VL_BG_7D="112,117,127" ;;
  gruvbox-dark)
    VL_BG_CTX="72,66,62"; VL_BG_5H="92,84,78"; VL_BG_7D="112,101,92" ;;
esac

VL_STYLE="pill"
VL_LAYOUT="fixed"
VL_MAX_LINES=3
VL_WRAP_MARGIN=4
VL_SEGMENTS="project git model effort duration lines"
VL_SEGMENTS2="ctx cost clock"
VL_SEGMENTS3=""
VL_CLOCK="24h"
VL_CLOCK_SECONDS=1
VL_BAR_WIDTH=5
VL_COST_DECIMALS=2
VL_PATH_DEPTH=4
VL_NAME_MAX=0
VL_ASCII=0
VL_LEAN_SEP=""
